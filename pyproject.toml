[project]
name = "Your-Project-Title"
version = "0.1.0"
description = "Your Project Description"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "psycopg>=3.2",
    "pydantic[email]>=2.6",
    "pydantic-settings>=2.2",
    "pyjwt>=2.8",
    "pwdlib[argon2]>=0.2",
    "python-multipart>=0.0.9",
    "alembic>=1.13",
    "qrcode[pil]",
    "requests>=2.31",
    "requests>=2.31",
    "pyotp>=2.10.0",
    "redis>=8.1.0",
    "cryptography>=50.0.2",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "ruff>=0.9.9",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "httpx2>=2.0",
    "httpx>=0.28.1",
]

[tool.uv]
package = false

[tool.fastapi]
entrypoint = "main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::pydantic.PydanticDeprecatedSince20",
    "ignore:Valid config keys have changed in V2:UserWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated"
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    "B008",

]


